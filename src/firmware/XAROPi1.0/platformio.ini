framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit_VL53L0X
    links2004/WebSockets
    bblanchon/ArduinoJson
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    pololu/VL53L0X @ ^1.3.1